name: Build Android App Bundle (.aab)

# Se ejecuta al hacer push a main, o manualmente desde la pestaña "Actions"
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-aab:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java (requerido por Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Sincronizar Capacitor (por si www/ cambió)
        run: npx cap sync android

      - name: Dar permisos de ejecución a Gradle
        run: chmod +x android/gradlew

      # --- Firma del AAB (opcional pero recomendado) ---
      # Si configuras los secrets de abajo en tu repo (Settings > Secrets and
      # variables > Actions), este paso restaura tu keystore real y el AAB
      # sale firmado, listo para subir a Google Play.
      # Si NO configuras los secrets, este paso simplemente no hace nada y
      # obtendrás un AAB sin firmar (sirve para revisar, no para publicar).
      - name: Restaurar keystore de firma (si existe)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks

      - name: Compilar Android App Bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease

      - name: Subir el .aab como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: amanecer-salud-renal-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
